
name: Build QuanLauncher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'QuanLauncher-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail
          yes | "$SDKMANAGER" --licenses

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Extract source code
        shell: bash
        run: |
          test -f QuanLauncher-source.zip
          mkdir -p "$RUNNER_TEMP/quan-source"
          unzip -q QuanLauncher-source.zip \
            -d "$RUNNER_TEMP/quan-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/quan-source" \
            -type f -name gradlew -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found in source ZIP"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          if ! find "$GITHUB_WORKSPACE/output" \
            -maxdepth 1 -name '*.apk' -type f | grep -q .; then
            echo "ERROR: No APK generated"
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLauncher-debug
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
