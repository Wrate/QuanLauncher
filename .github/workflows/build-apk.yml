
name: Build QuanLauncher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'QuanLauncher-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Extract source code
        run: |
          mkdir -p "$RUNNER_TEMP/quan-source"
          unzip -q QuanLauncher-source.zip \
            -d "$RUNNER_TEMP/quan-source"

      - name: Locate Android project
        run: |
          PROJECT_DIR="$(find "$RUNNER_TEMP/quan-source" \
            -name gradlew -type f -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Prepare native dependencies
        run: |
          cd "$PROJECT_DIR"
          if [ -f .gitmodules ]; then
            git submodule update --init --recursive
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          find "$PROJECT_DIR" \
            -type f -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} output/ \;

          if ! ls output/*.apk >/dev/null 2>&1; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLauncher-debug
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
