
name: Build QuanLauncher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'QuanLauncher-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Extract source code
        run: |
          unzip -q QuanLauncher-source.zip \
            -d "$RUNNER_TEMP/quan-source"
          echo "PROJECT_DIR=$RUNNER_TEMP/quan-source/LeviLaunchroid-main" >> "$GITHUB_ENV"

      - name: Prepare native dependencies
        run: |
          cd "$PROJECT_DIR"
          rm -rf app/src/main/cpp/preloader
          rm -rf app/src/main/cpp/libHttpClient
          git clone --depth 1 --recurse-submodules \
            https://github.com/LiteLDev/preloader-android.git \
            app/src/main/cpp/preloader
          git clone --depth 1 --recurse-submodules \
            https://github.com/microsoft/libHttpClient.git \
            app/src/main/cpp/libHttpClient

      - name: Prepare Firebase placeholder
        run: |
          mkdir -p "$PROJECT_DIR/app"
          cat > "$PROJECT_DIR/app/google-services.json" <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                "android_client_info": {
                  "package_name": "org.levimc.launcher"
                }
              },
              "oauth_client": [],
              "api_key": [{
                "current_key": "AIzaSyCIOnlyPlaceholderKey"
              }],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p output
          find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -exec cp {} output/QuanLauncher-debug.apk \;
          test -s output/QuanLauncher-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanLauncher-debug
          path: output/QuanLauncher-debug.apk
          if-no-files-found: error
          retention-days: 7
